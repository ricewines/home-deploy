# docker-compose.yml
services:
  ollama:
    container_name: ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    image: 'm.daocloud.io/docker.io/ollama/ollama:0.40.18'
    networks:
      - shared
    ports:
      - '11434:11434'
    restart: unless-stopped
    volumes:
      - D:\Users\CXH\data\ai\ollama:/root/.ollama
networks:
  shared:
    external: true